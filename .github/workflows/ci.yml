name: ci

on:
  pull_request:
    branches: [develop, main, backend-dev, frontend-dev, database-dev]
  push:
    branches: [develop, main, backend-dev, frontend-dev, database-dev]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
         node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/pec_test
        run: npm run prisma:generate

      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/pec_test
        run: npm run prisma:validate

      - name: Lint backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/pec_test
        run: npm run lint

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/pec_test
          TEST_PASSWORD: TestPassword123!
        run: npm test
      - name: Backend build check
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/pec_test
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
         node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000
        run: npm run build
